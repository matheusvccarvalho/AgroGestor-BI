
spring.application.name=AgroGestor-BI

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/agrogestor_bi?characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci&useInformationSchema=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Segurança: não expor detalhes técnicos em respostas de erro
server.error.include-stacktrace=never
server.error.include-message=never
